name: Build BPC Time Station Firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio esptool

      # 用仓库 Secrets 生成 include/secrets.h（未设置时生成空凭据，仍可编译）
      - name: Generate include/secrets.h
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASS }}
        run: |
          python - <<'PY'
          import os

          def esc(s: str) -> str:
              return s.replace('\\', '\\\\').replace('"', '\\"')

          ssid = esc(os.environ.get('WIFI_SSID', '') or '')
          pw = esc(os.environ.get('WIFI_PASSWORD', '') or '')
          with open('include/secrets.h', 'w', encoding='utf-8') as f:
              f.write('#pragma once\n')
              f.write('#define WIFI_SSID "%s"\n' % ssid)
              f.write('#define WIFI_PASSWORD "%s"\n' % pw)
          print('--- include/secrets.h ---')
          print(open('include/secrets.h', encoding='utf-8').read())
          PY

      - name: Build firmware
        run: pio run -e esp32-c3

      # 合并为单个可从 0x0 刷写的镜像（优先使用 PlatformIO 自带的 esptool v4）
      - name: Merge flash image
        run: |
          cd .pio/build/esp32-c3

          # 若构建目录没有 boot_app0.bin，从 framework 包中定位
          if [ ! -f boot_app0.bin ]; then
            BOOT_APP0="$(find "$HOME/.platformio" -name boot_app0.bin -print -quit)"
            echo "boot_app0.bin -> $BOOT_APP0"
            if [ -n "$BOOT_APP0" ]; then cp "$BOOT_APP0" boot_app0.bin; fi
          fi
          ls -l

          ESPTOOL_PY="$(find "$HOME/.platformio/packages/tool-esptoolpy" -name esptool.py -print -quit)"
          echo "esptool: ${ESPTOOL_PY:-python -m esptool}"

          if [ -n "$ESPTOOL_PY" ]; then
            python "$ESPTOOL_PY" --chip esp32c3 merge_bin -o merged.bin \
              --flash_mode dio --flash_freq 80m --flash_size 4MB \
              0x0 bootloader.bin \
              0x8000 partitions.bin \
              0xe000 boot_app0.bin \
              0x10000 firmware.bin
          else
            python -m esptool --chip esp32c3 merge-bin -o merged.bin \
              --flash-mode dio --flash-freq 80m --flash-size 4MB \
              0x0 bootloader.bin \
              0x8000 partitions.bin \
              0xe000 boot_app0.bin \
              0x10000 firmware.bin
          fi

          ls -l merged.bin

      - name: Prepare release files
        id: prep
        run: |
          VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp .pio/build/esp32-c3/merged.bin "dist/bpc-time-station-${VERSION}.bin"
          cp .pio/build/esp32-c3/merged.bin "dist/bpc-time-station.bin"
          # 分区块镜像：刷写时不覆盖 NVS(0x9000)，可保留已保存的 Wi-Fi 配网信息
          cp .pio/build/esp32-c3/bootloader.bin "dist/bpc-bootloader.bin"
          cp .pio/build/esp32-c3/partitions.bin "dist/bpc-partitions.bin"
          cp .pio/build/esp32-c3/boot_app0.bin   "dist/bpc-boot_app0.bin"
          cp .pio/build/esp32-c3/firmware.bin    "dist/bpc-app.bin"
          {
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/version.txt
          {
            echo "0x0     bpc-bootloader.bin"
            echo "0x8000  bpc-partitions.bin"
            echo "0xe000  bpc-boot_app0.bin"
            echo "0x10000 bpc-app.bin"
            echo "full:   0x0 bpc-time-station.bin   (single image; erases NVS)"
          } > dist/flash-layout.txt
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpc-time-station-${{ steps.prep.outputs.VERSION }}
          path: dist/*
          if-no-files-found: error

      # 维护一个滚动的 "latest" Release，供本地脚本匿名下载
      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest BPC Time Station build
          body: |
            Automated build of the ESP32-C3 BPC 68.5 kHz time-signal station.

            - version: `${{ steps.prep.outputs.VERSION }}`
            - commit: `${{ github.sha }}`

            Flashing (preserves saved Wi-Fi config):
            `write_flash -z 0x0 bpc-bootloader.bin 0x8000 bpc-partitions.bin 0xe000 bpc-boot_app0.bin 0x10000 bpc-app.bin`
          files: |
            dist/bpc-time-station.bin
            dist/bpc-time-station-${{ steps.prep.outputs.VERSION }}.bin
            dist/bpc-bootloader.bin
            dist/bpc-partitions.bin
            dist/bpc-boot_app0.bin
            dist/bpc-app.bin
            dist/version.txt
            dist/flash-layout.txt
          prerelease: false
          make_latest: true
          overwrite_files: true
